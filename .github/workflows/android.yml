name: Flutter CI/CD v8 (Release)

on:
  push:
    branches:
      - feature/dev-s1-use-CI/CD-pipeline
  workflow_dispatch:

permissions:
  contents: read   # ❗ push nahi kar rahe, to read enough hai

jobs:
  # -------------------------
  # 1️⃣ CI Job: Build & Test
  # -------------------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: ⚡ Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Run tests
        run: flutter test

      # -------------------------
      # 🔢 Auto Increment Version
      # -------------------------
      - name: 🔢 Auto Increment Version
        run: |
          currentCode=$(grep 'version: ' pubspec.yaml | sed 's/.*+//')
          nextCode=$((currentCode + 1))
          sed -i "s/\(version: .*+\).*/\1$nextCode/" pubspec.yaml
          echo "Updated version:"
          cat pubspec.yaml

      # -------------------------
      # 🔄 Refresh pubspec
      # -------------------------
      - name: 🔄 Refresh pubspec after version change
        run: flutter pub get

      # 🔐 Decode keystore
      - name: 🔐 Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 📝 Create key.properties
      - name: 📝 Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 🏗️ Build Release APK
      - name: 🏗️ Build APK (Release)
        run: flutter build apk --release

      # -------------------------
      # 🧾 DEBUG: Check Version
      # -------------------------
      - name: 🧾 Check final version used in build
        run: |
          echo "Final version in pubspec:"
          grep version pubspec.yaml

      # -------------------------
      # 📦 DEBUG: Check APK
      # -------------------------
      - name: 📦 Check APK file
        run: ls -lh build/app/outputs/flutter-apk/

      # 📤 Upload APK Artifact
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # -------------------------
  # 2️⃣ CD Job: Firebase Distribution
  # -------------------------
  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/

      - name: 🚀 Distribute to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "🚀 New CI/CD build with incremented version"