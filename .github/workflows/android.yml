name: Flutter CI/CD v10 (Release)

on:
  push:
    branches:
      - feature/dev-s1-use-CI/CD-pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------
  # 1️⃣ CI Job: Build & Test
  # -------------------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: ⚡ Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Run tests
        run: flutter test

      # 🔐 Decode keystore
      - name: 🔐 Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 📝 Create key.properties
      - name: 📝 Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 🏗️ Build APK
      - name: 🏗️ Build APK (Release)
        run: flutter build apk --release

      # 🧾 Verify version
      - name: 🧾 Verify version
        run: grep version pubspec.yaml

      # 📦 Verify APK exists
      - name: 📦 Verify APK file
        run: ls -lh build/app/outputs/flutter-apk/

      # 📤 Upload APK Artifact
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # -------------------------
  # 2️⃣ CD Job: Firebase
  # -------------------------
  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      # ✅ FIX: checkout added
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/

      # 🔍 Verify APK before upload
      - name: 🔍 Verify APK before Firebase
        run: |
          echo "APK files:"
          ls -lh build/app/outputs/flutter-apk/

      # 🧾 Final version check
      - name: 🧾 Final version before upload
        run: grep version pubspec.yaml

      # 🚀 Firebase Distribution
      - name: 🚀 Distribute to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "🚀 New build uploaded via CI/CD"